# 配置文件示例
# 代码知识提取工具配置

adapters:
  # MemoryKnowledge 适配器配置
  mk:
    api_url: http://localhost:8421
    api_prefix: /v3
    service_name: trial-svc
    team_name: trial-team

  # open-zread 适配器配置（无需配置，直接调用命令行）
  zread:
    # open-zread 通过命令行调用，无需额外配置

  # Understand-Anything 适配器配置
  # UA 是 Claude Code 插件，没有 HTTP API。adapter 会自己以
  # `claude -p --plugin-dir <plugin_dir>` 起一个非交互会话调用
  # understand-anything:understand skill，产物落到 <repo>/.ua/knowledge-graph.json
  ua:
    # 产物缺失或过期时是否自己驱动 UA。false 则退回纯读取，找不到就报错
    auto_run: true

    # UA 插件目录。留空则自动探测，顺序为：
    #   1. 环境变量 UA_PLUGIN_DIR
    #   2. ~/.understand-anything-plugin（install.sh 的默认位置）
    #   3. ~/.understand-anything/repo/understand-anything-plugin
    #   4. ~/.claude/plugins/understand-anything/understand-anything-plugin
    #   5. 与本仓库并列的 Understand-Anything/understand-anything-plugin
    # 都找不到时会报错并列出已尝试的路径。不要在此写死机器专属的绝对路径
    # plugin_dir: /path/to/understand-anything-plugin

    # 驱动 UA 的会话所用模型（支持通过 base_url/auth_token 切换为非 Anthropic 模型）
    model: deepseek-v4-flash

    # API base URL（留空则用 Claude Code 默认配置）
    base_url: https://api.deepseek.com/anthropic

    # API token（只从环境变量读取，不直接写明文）
    auth_token: ${DEEPSEEK_API_KEY}

    # 驱动超时（秒）。实测 2 文件约 10 分钟、5 文件约 12 分钟走完 7 个阶段，
    # 固定开销占大头；大仓批次多，给到 3 小时
    run_timeout: 10800

    # 产物已存在也强制重跑
    force_rerun: false

    # 产物 meta.json 的 gitCommitHash 与仓库 HEAD 不一致时视为过期并重跑。
    # 拿旧 commit 的图谱核验新代码会得出错误结论，保持 true
    require_fresh: true

    # data_dir 可选：显式指定知识图谱产物所在目录（不传则自动探测
    # <repo>/.ua/ 或旧版 <repo>/.understand-anything/）
    # data_dir: /path/to/.ua

# 输出路径配置
output:
  # 输出根目录：相对路径基于 scripts 目录解析（不是当前工作目录）
  # 命令行 --output-root 优先级高于此配置
  root: ../../output

# 二次提炼层配置
# 经 4router 使用 Claude。注意 4router 上不存在 claude-opus-4，
# 实际可用：claude-opus-4-6 / 4-7 / 4-8 / claude-opus-5 / claude-sonnet-5 / claude-sonnet-4-6
refiner:
  model: claude-opus-4-6

  # 4router 走 Anthropic 原生协议。注意这里不要带 /v1：
  # anthropic SDK 自己会拼 /v1/messages，带上会变成 /v1/v1/messages 报 404
  # 域名是 4router.net，不是 api.4router.net
  base_url: https://4router.net

  # API Key 只从环境变量读取，不写入本文件
  api_key: ${ANTHROPIC_API_KEY}

